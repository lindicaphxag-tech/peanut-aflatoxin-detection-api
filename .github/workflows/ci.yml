name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install Flask flask-cors pytest ruff

      - name: Lint
        run: ruff check app.py tests

      - name: Compile
        run: python -m py_compile app.py tests/test_api.py

      - name: Test
        run: python -m pytest -q
